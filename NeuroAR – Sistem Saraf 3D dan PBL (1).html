*{box-sizing:border-box}html,body{height:100%;margin:0}

<script>
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const INFO={
cerebrum:{n:'Otak besar (serebrum)',d:'Pusat berpikir, ingatan, kesadaran, dan gerak yang disadari. Permukaannya berlipat agar luasnya besar.'},
cerebellum:{n:'Otak kecil (serebelum)',d:'Mengoordinasikan gerak otot dan menjaga keseimbangan tubuh saat berdiri atau berjalan.'},
stem:{n:'Batang otak',d:'Mengatur fungsi vital tanpa disadari: detak jantung, napas, dan menghubungkan otak dengan sumsum tulang belakang.'},
spinal:{n:'Sumsum tulang belakang',d:'Jalur utama impuls dari dan ke otak. Juga pusat refleks, sehingga respons cepat tidak menunggu otak.'},
nerve:{n:'Saraf tepi',d:'Neuron sensorik membawa impuls dari reseptor ke pusat saraf. Neuron motorik membawa perintah ke otot dan kelenjar.'},
dend:{n:'Dendrit',d:'Cabang pendek yang menerima rangsang dari neuron lain atau reseptor, lalu meneruskannya ke badan sel.'},

lensa:{n:'Lensa mata',d:'Mengubah kecembungan (akomodasi) agar bayangan jatuh tepat di retina.'},

epidermis:{n:'Epidermis',d:'Lapisan terluar kulit sebagai pelindung, tipis tetapi peka terhadap sentuhan ringan.'},
dermis:{n:'Dermis',d:'Berisi pembuluh darah, kelenjar, akar rambut, dan banyak ujung saraf reseptor.'},

reseptor:{n:'Reseptor kulit',d:'Meissner dan Merkel peka sentuhan ringan, Pacini peka tekanan dan getaran, Ruffini peka regangan. Ujung saraf bebas peka nyeri dan suhu.'},
sarafkulit:{n:'Saraf sensorik',d:'Serabut yang membawa impuls dari reseptor menuju sumsum tulang belakang, lalu ke otak.'}};

add(neu,new THREE.SphereGeometry(.4,20,16),mat(0xf0abfc,.5),[-4.5,0,0],'soma');

for(let i=0;i<6;i++){const a=Math.PI*(.62+i*.15),d=[Math.cos(a),Math.sin(a),(i%2?.3:-.3)],o=-4.5,
 P=k=>[o+d[0]*k,d[1]*k,d[2]*k];tube(neu,[P(.9),P(2),P(3.1)],.07,dm,'dend');

const tr=(c,o={})=>mat(c,.15,Object.assign({transparent:true,opacity:.4,depthWrite:false},o));

[-.8,-.25,.3].forEach(x=>add(ear,new THREE.SphereGeometry(.17,12,10),mat(0xf5f5dc),[x,.1,0],'osikel'));

const hp=[];for(let i=0;i<=60;i++){const t=i/60,a=t*Math.PI*5,r=1-.65*t;hp.push(new THREE.Vector3(1.6+Math.cos(a)*r,-.5+t*1.3,Math.sin(a)*r))}

add(skin,new THREE.BoxGeometry(6,.5,3),tr(0xf4b693,{opacity:.6}),[0,1.7,0],'epidermis');
add(skin,new THREE.BoxGeometry(6,1.7,3),tr(0xe08e79,{opacity:.55}),[0,.6,0],'dermis');

add(skin,cyl(.06,2.4,8),mat(0x5b3a29,.05),[-1.8,2.4,.2]);
